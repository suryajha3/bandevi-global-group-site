# REVIEW ONLY. Include inside the existing BANDEVI server block only after review.
# Do not run deploy.py or apply this file as part of preparing the change.
location ^~ /api/analytics-consent/ {
    client_max_body_size 8k;
    access_log off;
    proxy_pass http://127.0.0.1:8766;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Bandevi-QA "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}
